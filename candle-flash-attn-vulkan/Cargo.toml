[package]
name = "candle-flash-attn-vulkan"
version = "0.8.4"
edition = "2021"
description = "Flash attention (variable-length) for the candle Vulkan backend."
license = "MIT OR Apache-2.0"

[dependencies]
candle = { path = "../candle-core", package = "candle-core", version = "0.8.4", features = ["_vulkan"] }

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
